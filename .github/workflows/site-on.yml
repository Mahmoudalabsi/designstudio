name: "🟢 تشغيل الموقع"

# زر مستقل في تبويب Actions → اضغط "Run workflow" فيظهر الموقع على كل المنصات الثلاث:
#   - Netlify: الموقع الكامل + Functions
#   - Cloudflare Pages: الموقع الكامل
#   - Render: استئناف خدمة الاستوديو
on:
  workflow_dispatch:

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 تحميل المستودع"
        uses: actions/checkout@v4

      - name: "⚙️ إعداد Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "✅ Netlify → الموقع الكامل + Functions"
        run: |
          npx -y netlify-cli@latest deploy \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --site "$NETLIFY_SITE_ID" \
            --dir . \
            --functions functions \
            --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: "✅ Cloudflare → الموقع الكامل"
        run: |
          # بناء مجلد dist نظيف (استبعاد .git/node_modules/netlify/functions)
          rm -rf cf-dist && mkdir -p cf-dist
          tar cf - \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./netlify' \
            --exclude='./functions' \
            --exclude='./update_password.py' \
            --exclude='./.netlify' \
            --exclude='./cf-dist' \
            --exclude='./__pycache__' \
            --exclude='./maintenance' \
            . | tar xf - -C cf-dist
          echo "files in cf-dist: $(find cf-dist -type f | wc -l)"
          npx -y wrangler@latest pages deploy cf-dist \
            --project-name=designstudio-app \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: "✅ Render → استئناف خدمة الاستوديو"
        run: |
          code=$(curl -sS -o /tmp/resume.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/srv-d95dekdckfvc73b89ib0/resume")
          echo "HTTP: $code"
          cat /tmp/resume.json || true
          # 202 = بدء الاستئناف، 400 = الخدمة تعمل أصلاً (مقبول)
          test "$code" = "202" || test "$code" = "400"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: "📢 النتيجة"
        run: echo "✅ الموقع يعمل بالكامل الآن على جميع المنصات الثلاث"
