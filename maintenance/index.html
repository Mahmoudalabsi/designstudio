<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الموقع مغلق مؤقتاً - استوديو التصاميم</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        background: linear-gradient(135deg, #fffdf8 0%, #f9eed5 50%, #f5e6c8 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(201, 168, 76, 0.25);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        text-align: center;
        box-shadow: 0 20px 60px rgba(168, 124, 32, 0.15);
      }
      .icon {
        width: 80px; height: 80px;
        margin: 0 auto 1.5rem;
        border-radius: 20px;
        background: linear-gradient(135deg, #c9a84c, #a87c20);
        display: flex; align-items: center; justify-content: center;
        font-size: 2.5rem;
        box-shadow: 0 8px 24px rgba(168, 124, 32, 0.25);
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 800;
        color: #1a1a1a;
        margin-bottom: 0.75rem;
      }
      p {
        color: #6b6b6b;
        font-size: 1rem;
        line-height: 1.8;
        margin-bottom: 0.5rem;
      }
      .hint { font-size: 0.85rem; color: #999; margin-top: 1.5rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">🛠️</div>
      <h1>الموقع مغلق مؤقتاً</h1>
      <p>تم إغلاق المنصة مؤقتاً من قِبل المالك.</p>
      <p>يرجى المحاولة لاحقاً.</p>
      <p class="hint">استوديو التصاميم</p>
    </main>
  </body>
</html>
